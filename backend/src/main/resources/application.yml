spring:
  application:
    name: salestorm-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/salestorm
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
